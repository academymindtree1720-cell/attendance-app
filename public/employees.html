<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employees - Panavelystories</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="toast-container" id="toasts"></div>
  <button class="mobile-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <h2>📋 Panavelystories</h2>
        <small>Attendance System</small>
      </div>
      <ul class="sidebar-nav">
        <li><a href="admin.html"><span class="icon">🏠</span> Dashboard</a></li>
        <li><a href="employees.html" class="active"><span class="icon">👥</span> Employees</a></li>
        <li><a href="attendance.html"><span class="icon">📊</span> Attendance</a></li>
        <li><a href="leaves.html"><span class="icon">📅</span> Leave Requests</a></li>
      </ul>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="avatar" id="avatarInitial">A</div>
          <div class="user-info">
            <div class="name" id="userName">Admin</div>
            <div class="role" id="userRole">admin</div>
          </div>
        </div>
        <button class="btn btn-ghost btn-sm btn-full" style="margin-top:12px" onclick="logout()">🚪 Logout</button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div>
          <h1>Employees</h1>
          <p class="subtitle">Manage your team members</p>
        </div>
        <button class="btn btn-primary" onclick="openModal('add')">➕ Add Employee</button>
      </div>

      <div class="glass-card">
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Username</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Department</th>
                <th>Role</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="employeeTable">
              <tr><td colspan="8"><div class="spinner"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="employeeModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Add Employee</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="employeeForm">
          <input type="hidden" id="editId">
          <div class="form-group">
            <label>Full Name *</label>
            <input type="text" id="fullName" required placeholder="John Doe">
          </div>
          <div class="form-group">
            <label>Username *</label>
            <input type="text" id="empUsername" required placeholder="johndoe">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="empPassword" placeholder="Leave blank to keep current">
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="empEmail" placeholder="john@example.com">
          </div>
          <div class="form-group">
            <label>Phone</label>
            <input type="text" id="empPhone" placeholder="+91 98765 43210">
          </div>
          <div class="form-group">
            <label>Department</label>
            <select id="empDept">
              <option value="General">General</option>
              <option value="Management">Management</option>
              <option value="Content">Content</option>
              <option value="Production">Production</option>
              <option value="Marketing">Marketing</option>
              <option value="HR">HR</option>
              <option value="Finance">Finance</option>
              <option value="IT">IT</option>
            </select>
          </div>
          <div class="form-group">
            <label>Role</label>
            <select id="empRole">
              <option value="employee">Employee</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="form-group" id="statusGroup" style="display:none">
            <label>Status</label>
            <select id="empStatus">
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveEmployee()">Save</button>
      </div>
    </div>
  </div>

  <script>
    function showToast(msg, type = 'info') {
      const c = document.getElementById('toasts');
      const t = document.createElement('div');
      t.className = `toast toast-${type}`;
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    async function logout() {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/';
    }

    async function checkAuth() {
      try {
        const res = await fetch('/api/me');
        const data = await res.json();
        if (!data.user || data.user.role !== 'admin') { window.location.href = '/'; return; }
        document.getElementById('userName').textContent = data.user.full_name;
        document.getElementById('avatarInitial').textContent = data.user.full_name[0].toUpperCase();
      } catch { window.location.href = '/'; }
    }

    async function loadEmployees() {
      try {
        const res = await fetch('/api/employees');
        const employees = await res.json();
        const tbody = document.getElementById('employeeTable');
        if (!employees.length) {
          tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><div class="icon">👥</div><h3>No employees</h3><p>Add your first team member</p></div></td></tr>';
          return;
        }
        tbody.innerHTML = employees.map(e => `
          <tr>
            <td><strong>${e.full_name}</strong></td>
            <td>${e.username}</td>
            <td>${e.email || '-'}</td>
            <td>${e.phone || '-'}</td>
            <td>${e.department}</td>
            <td><span class="badge ${e.role === 'admin' ? 'badge-accent' : 'badge-info'}">${e.role}</span></td>
            <td><span class="badge ${e.status === 'active' ? 'badge-success' : 'badge-danger'}">${e.status}</span></td>
            <td>
              <div class="actions">
                <button class="action-btn edit" onclick='openModal("edit", ${JSON.stringify(e)})' title="Edit">✏️</button>
                <button class="action-btn delete" onclick="deleteEmployee(${e.id}, '${e.full_name}')" title="Delete">🗑️</button>
              </div>
            </td>
          </tr>
        `).join('');
      } catch { showToast('Failed to load employees', 'error'); }
    }

    function openModal(mode, emp = null) {
      document.getElementById('employeeModal').classList.add('active');
      document.getElementById('employeeForm').reset();
      if (mode === 'edit' && emp) {
        document.getElementById('modalTitle').textContent = 'Edit Employee';
        document.getElementById('editId').value = emp.id;
        document.getElementById('fullName').value = emp.full_name;
        document.getElementById('empUsername').value = emp.username;
        document.getElementById('empUsername').disabled = true;
        document.getElementById('empEmail').value = emp.email || '';
        document.getElementById('empPhone').value = emp.phone || '';
        document.getElementById('empDept').value = emp.department;
        document.getElementById('empRole').value = emp.role;
        document.getElementById('empStatus').value = emp.status;
        document.getElementById('statusGroup').style.display = 'block';
      } else {
        document.getElementById('modalTitle').textContent = 'Add Employee';
        document.getElementById('editId').value = '';
        document.getElementById('empUsername').disabled = false;
        document.getElementById('statusGroup').style.display = 'none';
      }
    }

    function closeModal() {
      document.getElementById('employeeModal').classList.remove('active');
    }

    async function saveEmployee() {
      const id = document.getElementById('editId').value;
      const payload = {
        full_name: document.getElementById('fullName').value,
        username: document.getElementById('empUsername').value,
        email: document.getElementById('empEmail').value,
        phone: document.getElementById('empPhone').value,
        department: document.getElementById('empDept').value,
        role: document.getElementById('empRole').value,
        status: document.getElementById('empStatus').value
      };
      const pw = document.getElementById('empPassword').value;
      if (pw) payload.password = pw;

      try {
        const url = id ? `/api/employees/${id}` : '/api/employees';
        const method = id ? 'PUT' : 'POST';
        const res = await fetch(url, {
          method, headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
          showToast(id ? 'Employee updated!' : 'Employee added!', 'success');
          closeModal();
          loadEmployees();
        } else {
          showToast(data.error, 'error');
        }
      } catch { showToast('Save failed', 'error'); }
    }

    async function deleteEmployee(id, name) {
      if (!confirm(`Delete ${name}? This will remove all their attendance and leave records.`)) return;
      try {
        const res = await fetch(`/api/employees/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.success) {
          showToast('Employee deleted', 'success');
          loadEmployees();
        }
      } catch { showToast('Delete failed', 'error'); }
    }

    checkAuth();
    loadEmployees();
  </script>
</body>
</html>
