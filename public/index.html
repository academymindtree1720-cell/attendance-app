<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panavelystories Attendance</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1>Panavelystories</h1>
            <p>Employee Portal</p>
        </header>

        <main class="main-content">
            <!-- Loading State -->
            <div id="loading" class="loading">Loading connection to database...</div>

            <!-- Main App Area -->
            <div id="app-content" class="hidden">
                <!-- Employee Selection -->
                <div class="card">
                    <h2>Select Your Name</h2>
                    <select id="employee-select" class="premium-select">
                        <option value="" disabled selected>-- Choose Employee --</option>
                    </select>
                </div>

                <!-- Clock Controls -->
                <div class="card clock-card">
                    <div class="time-display" id="clock">00:00:00</div>
                    <div class="date-display" id="date">--</div>
                    
                    <div class="action-buttons">
                        <button id="btn-in" class="btn btn-primary" onclick="markAttendance('in')">Time In</button>
                        <button id="btn-out" class="btn btn-secondary" onclick="markAttendance('out')">Time Out</button>
                    </div>
                    <p id="attendance-status" class="status-msg"></p>
                </div>

                <!-- Apply For Leave -->
                <div class="card leave-card">
                    <h2>Apply for Leave</h2>
                    <form id="leave-form" onsubmit="applyLeave(event)">
                        <div class="form-group">
                            <label>Start Date</label>
                            <input type="date" id="leave-start" required class="premium-input">
                        </div>
                        <div class="form-group">
                            <label>End Date</label>
                            <input type="date" id="leave-end" required class="premium-input">
                        </div>
                        <div class="form-group">
                            <label>Reason</label>
                            <textarea id="leave-reason" rows="3" required class="premium-input" placeholder="Why are you taking leave?"></textarea>
                        </div>
                        <button type="submit" class="btn btn-accent">Submit Leave Request</button>
                        <p id="leave-status" class="status-msg"></p>
                    </form>
                </div>
            </div>
            
        </main>
        <footer class="footer">
            <a href="/admin.html" class="admin-link">Admin Dashboard</a>
        </footer>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
