<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Panavelystories Attendance</title>
  <meta name="description" content="Employee attendance tracking system for Panavelystories">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="toast-container" id="toasts"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="logo">
        <h1>📋 Panavelystories</h1>
        <p>Attendance Management System</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" placeholder="Enter your username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-full" id="loginBtn">
          Sign In
        </button>
      </form>

      <p style="text-align:center; margin-top:24px; font-size:0.8rem; color:var(--text-muted);">
        Contact admin for credentials
      </p>
    </div>
  </div>

  <script>
    function showToast(msg, type = 'info') {
      const c = document.getElementById('toasts');
      const t = document.createElement('div');
      t.className = `toast toast-${type}`;
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.textContent = 'Signing in...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (data.success) {
          showToast('Login successful!', 'success');
          setTimeout(() => {
            window.location.href = data.user.role === 'admin' ? '/admin.html' : '/employee-dashboard.html';
          }, 500);
        } else {
          showToast(data.error || 'Login failed', 'error');
          btn.textContent = 'Sign In';
          btn.disabled = false;
        }
      } catch (err) {
        showToast('Connection error', 'error');
        btn.textContent = 'Sign In';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
